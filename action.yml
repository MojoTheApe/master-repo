name: Validate delivery setup
description: Check a project's pinned delivery descriptor without executing its commands
inputs:
  project-root:
    description: Path to the checked-out consumer project
    default: .
    required: false
  allow-draft:
    description: Explicitly validate structural correctness during an incomplete audited adoption; never proves readiness
    default: 'false'
    required: false
runs:
  using: composite
  steps:
    - name: Validate descriptor and standard pin
      shell: bash
      env:
        PROJECT_ROOT: ${{ inputs.project-root }}
        ACTION_REVISION: ${{ github.action_ref }}
        ALLOW_DRAFT: ${{ inputs.allow-draft }}
      run: |
        args=()
        case "$ALLOW_DRAFT" in
          true) args+=(--allow-draft) ;;
          false) ;;
          *) echo 'allow-draft must be true or false' >&2; exit 2 ;;
        esac
        python3 "$GITHUB_ACTION_PATH/scripts/standard.py" validate --root "$PROJECT_ROOT" --expected-revision "$ACTION_REVISION" "${args[@]}"
