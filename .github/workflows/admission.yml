name: Trusted admission
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [Standard checks, PR metadata checks]
    types: [completed]
  repository_dispatch:
    types: [tracker-admission-state]
  workflow_dispatch:
  push:
    branches: [main]
  issues:
    types: [edited, labeled, unlabeled, closed, reopened]
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  actions: read
concurrency:
  group: trusted-admission
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: source-admission
      deployment: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Create a status-only token for this repository
        id: publisher
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ADMISSION_APP_CLIENT_ID }}
          private-key: ${{ secrets.ADMISSION_APP_PRIVATE_KEY }}
          permission-statuses: write
      - name: Evaluate current PRs using the accepted compatible Tracker snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_STATUS_TOKEN: ${{ steps.publisher.outputs.token }}
        run: python3 scripts/check_admission.py --config tracker/config.json --admission-policy tracker/admission-policy.json --trusted-revision "$(git rev-parse HEAD)"
