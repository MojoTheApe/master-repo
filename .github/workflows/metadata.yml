name: PR metadata checks
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: standard-metadata-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  tracker-link:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify real tracker issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_pr.py --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY"
  skill-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Project Workflow impact assessment
        run: python3 scripts/check_skill_impact.py --event "$GITHUB_EVENT_PATH"
